# Rime schema template
# encoding: utf-8

schema:
  version: "2.0.0"
  author:
    - TypeDuck Team
  description: |-
    TypeDuck 輸入法方案

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半形, 全形 ]
  - name: simplification
    states: [ 繁體, 简体 ]
    reset: 0
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - dictionary_lookup_filter
    - simplifier

dictionary_lookup_filter:
  dictionary: jyut6ping3_scolar

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - include:/fuzzy
      - include:/tone_ignore
      - include:/abbreviation
      - include:/tone_to_letter

translator:
  dictionary: jyut6ping3
  always_show_comments: true
  comment_format:
    - xform/^/\f/

simplifier:
  opencc_config: hk2s.json

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
