# Weasel settings
# encoding: utf-8

config_version: "2024.01.11"

app_options:
  cmd.exe:
    ascii_mode: true
  conhost.exe:
    ascii_mode: true

style:
  color_scheme: default
  preedit_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
  font_face: Chiron Sung HK:extra_light, MingLiU_HKSCS, MingLiU_HKSCS-ExtB, Microsoft JhengHei
  label_font_face: Century Gothic, Segoe UI, Microsoft JhengHei
  comment_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
  hint_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
  eng_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
  hin_font_face: Nirmala UI, Mangal
  urd_font_face: Urdu Typesetting, Tahoma, Segoe UI
  nep_font_face: Nirmala UI, Mangal
  ind_font_face: Times New Roman
  page_mark_font_face: Segoe UI
  preedit_font_point: 15
  font_point: 13
  label_font_point: 11
  comment_font_point: 11
  hint_font_point: 10
  eng_font_point: 12
  hin_font_point: 11
  urd_font_point: 13
  nep_font_point: 11
  ind_font_point: 12
  page_mark_font_point: 25
  inline_preedit: false
  preedit_type: composition
  display_tray_icon: false
  label_format: "%s."
  mark_text: ""
  layout:
    min_width: 0
    max_width: 0
    min_height: 0
    max_height: 0
    border_width: 3
    margin_x: 4
    margin_y: 4
    spacing: 8
    text_gap: 0
    candidate_spacing: 5
    hilite_spacing: 6
    hilite_padding: 3
    character_spacing: 8
    round_corner: 5
    corner_radius: 7
    shadow_radius: 0
    shadow_offset_x: 4
    shadow_offset_y: 4
  dictionary_panel:
    entry_font_face: DFKai-SB, Chiron Sung HK, MingLiU_HKSCS, MingLiU_HKSCS-ExtB, Microsoft JhengHei
    pron_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
    pron_type_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
    pos_font_face: Segoe UI:light, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
    register_font_face: Segoe UI:italic, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
    lbl_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
    field_key_font_face: Segoe UI, Microsoft JhengHei, MingLiU_HKSCS, MingLiU_HKSCS-ExtB
    field_value_font_face: Chiron Sung HK:extra_light, MingLiU_HKSCS, MingLiU_HKSCS-ExtB, Microsoft JhengHei
    more_languages_head_font_face: Segoe UI:medium
    entry_font_point: 32
    pron_font_point: 15
    pron_type_font_point: 12
    pos_font_point: 10
    register_font_point: 12
    lbl_font_point: 12
    field_key_font_point: 12
    field_value_font_point: 12
    more_languages_head_font_point: 13
    layout:
      padding_x: 22
      padding_y: 12
      title_gap: 20
      spacing: 16
      pos_border_width: 1
      pos_border_radius: 4
      pos_padding: 3
      pos_gap: 8
      lbl_gap: 8
      definition_gap: 18
      field_spacing: 5
      field_gap: 12
      more_languages_spacing: 5
      entry_spacing: 18

